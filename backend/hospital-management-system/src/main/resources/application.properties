spring.application.name=hospital-management-system
server.port=${SERVER_PORT:8080}

# MySQL connection. Create the database and grant this account access before startup.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_management?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:hospital_user}
spring.datasource.password=${DB_PASSWORD:HospitalDev_2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Configure a strong secret (32+ characters) and never commit it. Tokens expire after 30 minutes.
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:hospital-management-system}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:1800}

# Optional one-time initial administrator provisioning. Leave both unset after the account exists.
app.bootstrap-admin.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.bootstrap-admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}
